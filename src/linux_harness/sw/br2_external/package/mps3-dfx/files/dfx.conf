# /etc/mps3/dfx.conf — mps3_dfx.ko load-time arguments (read by S10mps3dfx).
#
# The mock-vs-MMIO backend is a DEPLOY-TIME TECH SEAM. This image is
# sim/QEMU-verified only, so it ships mock=1 (the in-kernel behavioural ICAP
# mock) — the swap path is live under QEMU with no real ICAPE3.
#
# AT BOARD PROVISIONING (Wave-4 B1, first real swap through ICAPE3):
#   set  DFX_MODULE_ARGS="mock=0"
# to bind the real MMIO shell map. Optionally append per-block overrides,
# e.g. hwicap_phys=0x44A20000 dfxctl_phys=0x44A10000 clkrst_phys=0x44A00000
# (defaults come from drivers/icap/mps3_icap_regs.h — HWICAP=0x44A2_0000,
#  DFXCTL=0x44A1_0000, CLKRST=0x44A0_0000; keep this example in that order).
DFX_MODULE_ARGS="mock=1"
