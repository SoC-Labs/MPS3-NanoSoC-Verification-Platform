# /usr/share/mps3/openocd/designs.conf -- mps3-debug's design table (the board's copy
# of the Harness Manager's DAP_DESIGN_CONFIGS, harness_manager_mps3/constants.py).
#
# One design per line, keyed by the design number (rm_id & 0xFFFF, the version-stable
# half: fpga/dfx/rm_list.tcl). `mps3-debug up --rm auto` looks the loaded rm_id up here;
# `--rm NAME` looks the name up.
#   design=0xNNNN name=NAME dap=no                              -> exit 13 (no_dap)
#   design=0xNNNN name=NAME [gdb=N] cfg=a.cfg[,b.tcl..] [attach=target:proc[,..]]
# cfg files are OpenOCD -f arguments, searched in this directory (host/openocd, copied
# by the mps3-debug package). gdb = cores = GDB ports from 3333 up. attach = the
# gdb-attach event hook per core: the configs create the cores -defer-examine (AHBSLV=0
# mirrors PPB reads of a running core), so a GDB attach first halts through the AP and
# examines (HM services/debug.py rule 2).
# A design number that is not here is exit 14 (no_cfg): pass --rm NAME.

design=0x0000 name=greybox           dap=no
design=0x0001 name=nanosoc           cfg=nanosoc_mps3_jtag.cfg,nanosoc_ops.tcl attach=nanosoc.cpu0:nanosoc_halt_examine
design=0x0002 name=eth_ss            dap=no
# UNPROVEN on silicon: the two-AP config is new (host/openocd/nanosoc_mps3_multicore_jtag.cfg)
design=0x0003 name=nanosoc_multicore gdb=2 cfg=nanosoc_mps3_multicore_jtag.cfg,nanosoc_ops.tcl attach=nanosoc.cpu0:nanosoc_halt_examine,nanosoc.cpu1:nanosoc_halt_examine1
design=0x0004 name=uart_echo         dap=no
design=0x0005 name=nanosoc_upy       cfg=nanosoc_mps3_jtag.cfg,nanosoc_ops.tcl attach=nanosoc.cpu0:nanosoc_halt_examine
design=0x0006 name=socscope          dap=no
design=0x0007 name=clcd_demo         dap=no
design=0x0008 name=nanosoc_iice      cfg=nanosoc_iice_chain.cfg,nanosoc_ops.tcl attach=nanosoc.cpu0:nanosoc_halt_examine
design=0x0009 name=dbg_demo          dap=no
# rp_nanosoc_wrapper nested unchanged + an RM ILA: the same one-TAP DAP as nanosoc
design=0x000A name=nanosoc_ila       cfg=nanosoc_mps3_jtag.cfg,nanosoc_ops.tcl attach=nanosoc.cpu0:nanosoc_halt_examine
design=0x001E name=led               dap=no
design=0x00A1 name=regdemo_a         dap=no
design=0x00B2 name=regdemo_b         dap=no
