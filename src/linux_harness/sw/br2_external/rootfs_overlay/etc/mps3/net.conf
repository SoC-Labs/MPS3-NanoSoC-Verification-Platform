# /etc/mps3/net.conf — sourced by /etc/init.d/S41mps3net (IMAGE_CONTRACT §5).
# Edits persist when /persist is on the user microSD (/etc/mps3 overlay).
#
# MODE: auto   = DHCP first, this board's static address as a permanent
#                secondary (default)
#       dhcp   = DHCP only
#       static = the static address only
# The kernel cmdline mps3.net=auto|dhcp|static overrides it.
MPS3_NET_MODE=auto

# THE STATIC ADDRESS, THE MAC AND THE HOSTNAME ARE THE BOARD IDENTITY'S
# (/run/mps3/identity, lane IDENT 2026-09-28): the /persist override, else this
# board's stage0 bake, else 192.168.10.101/24. Change them with
#   mps3-identity set ip=192.168.10.102/24 [mac=..] [hostname=..] [label=..]
# (applies at the next boot). A MPS3_NET_STATIC / MPS3_HOSTNAME set here is used
# only by an image without the identity resolver. The static address is skipped
# (and logged) if duplicate-address detection finds it taken.

# Bounded foreground DHCP attempt before boot carries on; udhcpc keeps trying
# in the background after that.
MPS3_DHCP_TRIES=2
MPS3_DHCP_TIMEOUT=2

# Seconds to wait for carrier after `ip link set eth0 up` (the LAN9220 runs
# its PHY self-test inside open(), then autonegotiates).
MPS3_NET_CARRIER_WAIT=6

# Hostname: the board identity's (see above). Sent to the DHCP server.
