# signals_nanosoc_asbuilt.yaml -- THE PROBE SET THAT IS ACTUALLY IN THE BUILT
# BITSTREAM. Recovered verbatim from commit 39bd2cb (the state of
# signals_nanosoc.yaml immediately before b49f4f7 retargeted it).
#
# WHY THIS FILE EXISTS
#   signals_nanosoc.yaml was retargeted to 13 signals / 113 bits to localise the
#   M0 loop PC. The placed-and-routed bitstream on disk
#   (fpga/dfx/build/prod/config_rm_nanosoc_pblock_rp_dut_partial.bit) PREDATES
#   that retarget and carries the 6-signal / 69-bit set below -- verified against
#   the instrumentation run's own log:
#     fpga/rp/nanosoc_iice/build/rev_1_identify/identify.log:39-61,76-77
#       HADDR(32) HTRANS(2) HWRITE(1) trigger+sample  = 35 bits
#       HRDATA(32) HREADY(1) CORE_LOCKUP(1) sample    = 34 bits
#       Depth 1024   Width 69 bits
#   A capture off THAT bitstream therefore carries THESE six signals, and
#   normalising it against the retargeted manifest fails set-equality (exit 2,
#   correctly). Use this manifest for any capture taken before the RM is rebuilt.
#
# WHAT THIS SET CANNOT DO, relative to the retargeted one -- read before drawing
# conclusions from a capture:
#   * NO hprot   -- cannot separate an OPCODE FETCH from a DATA ACCESS. On an M0
#                   there is one address bus, so without this bit `haddr` is an
#                   interleaving of PC values and operand addresses. Loop
#                   STRUCTURE is still visible (htrans[1] marks active transfers,
#                   NONSEQ marks branch targets, hrdata gives the instruction
#                   word), but the trace is not a clean PC history.
#   * NO hwdata  -- cannot test "the firmware prints and the console swallows it"
#                   against "it never gets as far as printing".
#   * NO sleeping-- cannot tell a busy spin from a WFI/WFE park.
#   * NO sysresetreq / hresetn -- cannot rule out a REPEATED RESET, which also
#                   looks like "fetches from 0x0 forever".
#   * NO remap_ctrl -- at low addresses, cannot tell bootrom from post-REMAP IMEM.
#   If a capture with this set does not settle the question, THAT is the argument
#   for spending a rebuild on the 113-bit set -- not the other way round.
#
# Do not edit this file to add signals. It is a record of what is in silicon.
# ---------------------------------------------------------------------------

iice:
  name: IICE_CPU
  # 1024 samples = 20.48 us at 50 MHz dut_clk.
  depth: 1024
  trigger_time: middle
  # `none` = simple triggering: the IICE ANDs the per-signal watch conditions.
  # IICE_SIM_VS_HW_TRACE_PLAN.md §6 V3 says keep the FIRST real IICE simple
  # (`none`, or a 2-condition/2-state SM) with no compression, no qualified
  # sampling and no always-armed — features are mutually exclusive in Identify
  # anyway, and a clean baseline compare comes first.
  #
  # CONSEQUENCE for `trigger.expr` below: with `none`, the expression must stay
  # a pure CONJUNCTION of per-signal conditions, because that is all simple
  # triggering can express. An `||` here would be honoured by the sim shadow and
  # silently mistranslated on the hardware side. Switch `controller` to
  # `statemachine` before writing anything that is not an AND-chain.
  controller: none
  trigger_conditions: 1
  trigger_states: 2
  clock:
    hw:   /dut_clk                              # port of the synthesis top: no prefix
    sim:  micropython_flash_boot_tb.dut_clk
    edge: positive

signals:
  # --- AHB-Lite address phase ----------------------------------------------
  - name:    haddr
    width:   32
    hw:      /u_rm/u_nanosoc/u_ss_cpu/u_cpu_0/HADDR
    sim:     micropython_flash_boot_tb.u_nanosoc.u_ss_cpu.u_cpu_0.HADDR
    sample:  true
    trigger: true
    radix:   hex

  - name:    htrans
    width:   2
    hw:      /u_rm/u_nanosoc/u_ss_cpu/u_cpu_0/HTRANS
    sim:     micropython_flash_boot_tb.u_nanosoc.u_ss_cpu.u_cpu_0.HTRANS
    sample:  true
    trigger: true
    radix:   bin

  - name:    hwrite
    width:   1
    hw:      /u_rm/u_nanosoc/u_ss_cpu/u_cpu_0/HWRITE
    sim:     micropython_flash_boot_tb.u_nanosoc.u_ss_cpu.u_cpu_0.HWRITE
    sample:  true
    trigger: true
    radix:   bin

  # --- AHB-Lite data phase + status (sample-only) ---------------------------
  - name:    hrdata
    width:   32
    hw:      /u_rm/u_nanosoc/u_ss_cpu/u_cpu_0/HRDATA
    sim:     micropython_flash_boot_tb.u_nanosoc.u_ss_cpu.u_cpu_0.HRDATA
    sample:  true
    trigger: false
    radix:   hex

  - name:    hready
    width:   1
    hw:      /u_rm/u_nanosoc/u_ss_cpu/u_cpu_0/HREADY
    sim:     micropython_flash_boot_tb.u_nanosoc.u_ss_cpu.u_cpu_0.HREADY
    sample:  true
    trigger: false
    radix:   bin

  # CORE_LOCKUP, not LOCKUP — verified against nanosoc_ss_cpu.sv:209. This is
  # the one signal the RM boundary CANNOT give us: rp_nanosoc_wrapper ties
  # dut_lockup to 1'b0 because nanosoc.sv never routes cpu_0_lockup to a
  # top-level port (see its A6-gap note), so an IICE probe one level down is the
  # only way to see it on silicon. That is precisely what this harness is for.
  - name:    lockup
    width:   1
    hw:      /u_rm/u_nanosoc/u_ss_cpu/u_cpu_0/CORE_LOCKUP
    sim:     micropython_flash_boot_tb.u_nanosoc.u_ss_cpu.u_cpu_0.CORE_LOCKUP
    sample:  true
    trigger: false
    radix:   bin

trigger:
  # First CPU WRITE to the IMEM base. In the flash-boot bench, stage-0 CPU-copies
  # the HOT image out of QSPI flash 0x1000 into IMEM at 0x1000_0000 before REMAP
  # (see tests/micropython_flash_boot/micropython_flash_boot_tb.sv header), so
  # this fires at the start of the copy loop — well after reset, with real
  # pre-trigger history, and right at the boot step most likely to differ between
  # sim and silicon.
  #
  # Pure AND-chain: required by `controller: none` (see the note above).
  expr: "htrans == 2'b10 && hwrite == 1'b1 && haddr == 32'h1000_0000"
